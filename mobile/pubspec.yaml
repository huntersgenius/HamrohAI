name: hamroh
description: Hamroh — surunkali kasallik kuzatuvi va shifokor konsultatsiyasi platformasi.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management. Providers are declared by hand rather than generated, so
  # the project builds without a code-generation step.
  flutter_riverpod: ^2.5.1

  # Networking + secure token storage
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Navigation
  go_router: ^13.2.0

  # Sign-in providers
  google_sign_in: ^6.2.1
  url_launcher: ^6.2.5

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.0.0

  # Charts for the trend cards
  fl_chart: ^0.66.2

  # Files: licence upload, thread documents, Excel export/import
  file_picker: ^8.1.7
  image_picker: ^1.0.7
  open_filex: ^4.4.0
  path_provider: ^2.1.2

  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
