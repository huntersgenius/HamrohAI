name: frontend-ci

# Every push and every pull request analyses, tests and builds the Flutter app.
#
# The SDK comes from `subosito/flutter-action` with `cache: true`, so it is
# restored from the GitHub Actions cache instead of being downloaded into a
# temporary directory on each run. The version is pinned so a Flutter release
# cannot change the build under us.

on:
  push:
    branches: ["**"]
    paths:
      - "mobile/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.29.3"

jobs:
  android:
    name: analyze + test + build apk (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Caches both the SDK itself and the pub package cache between runs.
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: flutter build apk --release
        run: flutter build apk --release

      - name: Report the artefact
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: hamroh-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    # iOS can only be compiled on macOS: the toolchain needs Xcode, which does
    # not exist on Linux. This job is the place where `flutter build ios` is
    # actually verified — a Linux container cannot do it at all.
    name: build ios --no-codesign (macOS)
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:"

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build ios --no-codesign
        run: flutter build ios --release --no-codesign

      - name: Report the artefact
        run: ls -lh build/ios/iphoneos/
